name: threads-autopost
on:
  schedule:
    # GitHub無料枠はscheduleが大幅に間引かれるため、投稿時間帯(JST)の前後だけ高頻度に試行する。
    # cronはUTC。JST 8:00=UTC23:00 / JST18:00=UTC9:00 / JST21:00=UTC12:00
    - cron: "*/5 22-23 * * *"   # JST 07:00-08:59 → 8:00枠
    - cron: "*/5 8-9 * * *"     # JST 17:00-18:59 → 18:00枠
    - cron: "*/5 11-12 * * *"   # JST 20:00-21:59 → 21:00枠
    - cron: "3,33 * * * *"      # 保険: 毎時2回は必ず回す
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - name: Run autopost
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python3 threads_autopost_cloud.py
      - name: Commit queue changes
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost@noreply.local"
          if ! git diff --quiet queue.json; then
            git add queue.json
            git commit -m "update queue status"
            git pull --rebase
            git push
          fi
