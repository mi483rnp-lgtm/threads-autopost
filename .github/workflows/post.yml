name: threads-autopost
on:
  schedule:
    # 毎時2回だけ。複数cronの同時起動による二重投稿を避けるため単純化。
    # 予約時刻に多少遅れても投稿する設計（7-22時のどこかで拾う）なのでこれで足りる。
    - cron: "3,33 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - name: Run autopost
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python3 threads_autopost_cloud.py
      - name: Commit queue changes
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost@noreply.local"
          if ! git diff --quiet queue.json; then
            git add queue.json
            git commit -m "update queue status"
            git pull --rebase
            git push
          fi
