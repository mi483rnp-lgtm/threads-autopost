name: threads-autopost
on:
  schedule:
    # publicリポジトリなのでscheduleがほぼ正常に動く。10分粒度で予約時刻を拾う。
    # 二重投稿は冪等性チェック（同内容がタイムラインにあれば投稿しない）で防止。
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - name: Run autopost
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python3 threads_autopost_cloud.py
      - name: Commit queue changes
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost@noreply.local"
          if ! git diff --quiet queue.json; then
            git add queue.json
            git commit -m "update queue status"
            git pull --rebase
            git push
          fi
